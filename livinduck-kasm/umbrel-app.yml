manifestVersion: 2
id: livinduck-kasm
category: networking
name: Kasm Workspaces
version: "1.19.0-2"
tagline: Stream desktops and applications to your browser
description: >-
  Run Linux desktops and applications in your browser. Requires umbrelOS 2.0
  or later for HTTPS. Open the app directly from Umbrel: on first use it opens
  the setup wizard, and afterward it opens Kasm itself on the same address.


  Review the Kasm license, choose administrator and user passwords, and select
  your workspaces. Downloads and initial startup can take several minutes and
  many gigabytes. Keep the installer open and avoid starting another installation
  while it is running. Once setup finishes, Kasm opens automatically.


  Sign in as admin@kasm.local using your chosen password. Both setup and Kasm
  are protected by Umbrel login. The setup and upgrade wizard remains available
  at /setup/ on the same app address. HTTPS uses Umbrel's certificate; follow
  Umbrel's HTTPS setup instructions if your browser does not yet trust it.


  This package uses LinuxServer.io's container with privileged mode for its
  nested Docker engine. Allow at least 2 CPU cores, 4 GB RAM and 50 GB free
  storage, plus resources for workspaces. AMD64 and ARM64 are supported.
  Sessions are disposable unless you configure persistent profiles.
  Updating the package alone does not upgrade an existing Kasm installation.
releaseNotes: >-
  Requires umbrelOS 2.0. Kasm now opens directly on HTTPS port 39401, using
  Umbrel's HTTPS support and login protection. The extra launcher and exposed
  port 39402 are removed. First use opens /setup/ on the same address; setup
  completion opens Kasm automatically. Existing default-zone configurations
  using port 39402 are migrated to use the browser's port. Accounts and
  workspace data are preserved. Replace old port-39402 bookmarks.

developer: Kasm Technologies
