version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: livinduck-shelfarr_server_1
      APP_PORT: 80

  server:
    image: ghcr.io/pedro-revez-silva/shelfarr:2026.10.05.1@sha256:b4bbdf278cfe6aa4773b102c192ad9c79263c573fc8b51c5861d1a093f9e9092
    restart: on-failure
    init: true
    stop_grace_period: 1m
    environment:
      SOLID_QUEUE_IN_PUMA: "1"
      HTTP_PORT: "80"
      PUID: "1000"
      PGID: "1000"
      CHOWN_ON_START: auto
      TZ: UTC
      SHELFARR_LIBATION_URL: http://livinduck-shelfarr_libation_1:8080
      SHELFARR_LIBATION_TOKEN_FILE: /run/shelfarr-libation/token
      SHELFARR_LIBATION_IMPORT_ROOT: /imports/libation
    volumes:
      - ${APP_DATA_DIR}/data/storage:/rails/storage
      - ${APP_DATA_DIR}/data/audiobooks:/audiobooks
      - ${APP_DATA_DIR}/data/ebooks:/ebooks
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
      - ${APP_DATA_DIR}/data/libation-books:/imports/libation:ro
      - ${APP_DATA_DIR}/data/libation-control:/run/shelfarr-libation:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  libation:
    image: ghcr.io/pedro-revez-silva/shelfarr-libation:2026.10.05.1@sha256:ff8e082db0532adac0553909266f60c23771158ed09a4b51c8045fc998f613e5
    restart: on-failure
    init: true
    environment:
      PUID: "1000"
      PGID: "1000"
      CHOWN_ON_START: auto
      TZ: UTC
      LIBATION_FILES_DIR: /config
      LIBATION_BOOKS_DIR: /data
      LIBATION_IN_PROGRESS_DIR: /config/in-progress
      COMPANION_STATE_DIR: /config/shelfarr-companion
      COMPANION_TOKEN_FILE: /control/token
      ASPNETCORE_URLS: http://0.0.0.0:8080
    volumes:
      - ${APP_DATA_DIR}/data/libation-config:/config
      - ${APP_DATA_DIR}/data/libation-books:/data
      - ${APP_DATA_DIR}/data/libation-control:/control
    healthcheck:
      test: ["CMD", "/companion/Shelfarr.Libation.Companion", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
