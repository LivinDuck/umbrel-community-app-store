name: Validate Murmur Web
on:
  workflow_dispatch:
  push:
    paths:
      - livinduck-murmur-web/**
      - tests/smoke_murmur.py
      - .github/workflows/murmur-validation.yml
  pull_request:
    paths:
      - livinduck-murmur-web/**
      - tests/smoke_murmur.py
      - .github/workflows/murmur-validation.yml
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - name: Check web-only operation, external Hermes authentication and persistence
        run: python -u tests/smoke_murmur.py
