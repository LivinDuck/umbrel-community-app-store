name: Validate Shelfarr
on:
  workflow_dispatch:
  push:
    paths:
      - livinduck-shelfarr/**
      - tests/smoke_shelfarr.py
      - .github/workflows/shelfarr-validation.yml
  pull_request:
    paths:
      - livinduck-shelfarr/**
      - tests/smoke_shelfarr.py
      - .github/workflows/shelfarr-validation.yml
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2 requests==2.32.5
      - name: Check onboarding, authentication, companion and persistence
        run: python -u tests/smoke_shelfarr.py
