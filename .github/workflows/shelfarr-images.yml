name: Build custom Shelfarr
on:
  workflow_dispatch:
  push:
    paths:
      - livinduck-shelfarr/custom/**
      - .github/workflows/shelfarr-images.yml
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix livinduck-shelfarr/custom/extensions/orbit --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix livinduck-shelfarr/custom/extensions/orbit
      - run: npm run build --prefix livinduck-shelfarr/custom/extensions/orbit
      - run: python3 livinduck-shelfarr/custom/extensions/orbit/package-source.py
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: livinduck-shelfarr/custom
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/livinduck/shelfarr:2026.10.05.1-custom-${{ github.sha }}
      - name: Record immutable image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ghcr.io/livinduck/shelfarr@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
