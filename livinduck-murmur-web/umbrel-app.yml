manifestVersion: 1.1
id: livinduck-murmur-web
storage:
  dataRoot: data
category: ai
name: Murmur Web
version: "0.9.0"
tagline: A web interface for your existing Hermes agents
description: >-
  Murmur's web interface without a bundled Hermes instance. Requires the separate
  Hermes Agent app on Umbrel. On first open, choose your Hermes server and enter
  its username and password if required. The local Hermes Agent is suggested.


  Chat with individual agents or groups, follow streaming replies, and manage
  your agents from your phone or computer. Add the app to your phone's home
  screen for quick access. Voice input requires HTTPS.


  Umbrel login protects the interface. Murmur settings persist in this app's
  data folder; agents, chats, models and API keys remain in the separate Hermes
  Agent app. This package never starts a second Hermes instance.


  This is a separate community package. It does not import data from the official
  Murmur app's bundled Hermes. Additional remote Hermes servers can be added in
  Settings. Saved connections and their credentials can be edited there.
releaseNotes: >-
  Updates Murmur to 0.9.0 with email for agents, apps connected through Nous
  Research after consent, and support for any OpenAI-compatible model server,
  including servers that require an API key.


  Adds clearer helper progress cards, improved sidebar ordering and single-agent
  chat lists, and fixes for iPhone Home Screen icons and duplicate chat names.


  Email requires the murmur-mail plugin in your separate Hermes Agent, included
  in Umbrel's Hermes image v0.22.5-1. Hermes installations without the plugin
  do not offer email. This package does not install or update Hermes Agent.


  Preserves web-only operation, editable connections, saved settings and the
  custom Samsung dark icon. No bundled Hermes container is installed.


  Full release notes: https://github.com/getumbrel/murmur/releases/tag/v0.9.0
developer: Umbrel
website: https://github.com/getumbrel/murmur
dependencies:
  - hermes-agent
repo: https://github.com/getumbrel/murmur
support: https://github.com/LivinDuck/umbrel-community-app-store/issues
port: 39406
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: LivinDuck
submission: https://github.com/LivinDuck/umbrel-community-app-store
