version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: livinduck-bookorbit_server_1
      APP_PORT: 3000
      PROXY_AUTH_WHITELIST: /api/v1/opds,/api/v1/opds/*,/api/v1/kobo/*,/api/v1/koreader/users/auth,/api/v1/koreader/users/create,/api/v1/koreader/syncs/progress,/api/v1/koreader/syncs/progress/*,/api/v1/koreader/plugin/*
      PROXY_AUTH_BLACKLIST: /api/v1/kobo/devices,/api/v1/kobo/devices/*,/api/v1/kobo/settings,/api/v1/kobo/history
  server:
    image: ghcr.io/bookorbit/bookorbit:3.3.0@sha256:4c2a1b957a3c8aeb9f59bb27a7d8efb18fa42c758afed3dcfc62620c5bcd1831
    restart: on-failure
    init: true
    environment:
      NODE_ENV: production
      PORT: '3000'
      POSTGRES_HOST: livinduck-bookorbit_postgres_1
      POSTGRES_PORT: '5432'
      POSTGRES_USER: bookorbit
      POSTGRES_DB: bookorbit
      POSTGRES_PASSWORD: ${APP_LIVINDUCK_BOOKORBIT_POSTGRES_PASSWORD}
      JWT_SECRET: ${APP_LIVINDUCK_BOOKORBIT_JWT_SECRET}
      SETUP_BOOTSTRAP_TOKEN: ${APP_LIVINDUCK_BOOKORBIT_SETUP_TOKEN}
      APP_URL: http://${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}
      TZ: UTC
      PUID: '1000'
      PGID: '1000'
      LIBRARY_BROWSE_ROOT: /books
      DISABLE_LOCAL_AUTH: 'false'
      PODCAST_ENCRYPTION_KEY: ${APP_LIVINDUCK_BOOKORBIT_PODCAST_KEY}
      EMAIL_ENCRYPTION_KEY: ${APP_LIVINDUCK_BOOKORBIT_EMAIL_KEY}
      MIGRATION_ENCRYPTION_KEY: ${APP_LIVINDUCK_BOOKORBIT_MIGRATION_KEY}
      BOOK_REQUEST_ENCRYPTION_KEY: ${APP_LIVINDUCK_BOOKORBIT_BOOK_REQUEST_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
    - ${APP_DATA_DIR}/data/app:/data
    - ${APP_DATA_DIR}/data/books:/books
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
    security_opt:
    - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -T
      - '4'
      - -O
      - /dev/null
      - http://127.0.0.1:3000/api/v1/health
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
  postgres:
    image: pgvector/pgvector:0.8.2-pg18@sha256:42e7f6b4e1eceb02ff14e3e6bc6108bbe259abbe83879dc1845d0da1ddeb555d
    restart: on-failure
    environment:
      POSTGRES_USER: bookorbit
      POSTGRES_DB: bookorbit
      POSTGRES_PASSWORD: ${APP_LIVINDUCK_BOOKORBIT_POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
    - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  setup:
    image: ghcr.io/bookorbit/bookorbit:3.3.0@sha256:4c2a1b957a3c8aeb9f59bb27a7d8efb18fa42c758afed3dcfc62620c5bcd1831
    restart: on-failure
    entrypoint:
    - node
    - -e
    - |-
      const fs = require('node:fs');
      (async () => {
        const base = 'http://livinduck-bookorbit_server_1:3000/api/v1/auth';
        const response = await fetch(base + '/setup-status');
        if (!response.ok) throw new Error('Setup status HTTP ' + response.status);
        if (!(await response.json()).needsSetup) return;
        const password = 'Bo1-' + process.env.ADMIN_PASSWORD;
        fs.writeFileSync('/onboarding/admin-password.txt', password + '\n', {mode: 0o600});
        const setup = await fetch(base + '/setup', {method:'POST', headers:{'Content-Type':'application/json','x-setup-token':process.env.SETUP_TOKEN}, body:JSON.stringify({username:'admin',name:'Administrator',email:'admin@example.com',password})});
        if (!setup.ok) throw new Error('Setup HTTP ' + setup.status);
        console.log('Administrator created; initial password saved to onboarding/admin-password.txt');
      })().then(() => setInterval(() => {}, 3600000)).catch(error => { console.error(error.message); process.exit(1); });
    environment:
      ADMIN_PASSWORD: ${APP_LIVINDUCK_BOOKORBIT_ADMIN_PASSWORD}
      SETUP_TOKEN: ${APP_LIVINDUCK_BOOKORBIT_SETUP_TOKEN}
    depends_on:
      server:
        condition: service_healthy
    volumes:
    - ${APP_DATA_DIR}/data/onboarding:/onboarding
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      disable: true
    user: 1000:1000
