manifestVersion: 1
id: livinduck-hydrodactyl
storage:
  dataRoot: data
category: social
name: Hydrodactyl
version: "6.4.1"
tagline: Manage your game servers from one panel
description: >-
  Hydrodactyl is the successor to Pyrodactyl, with a browser-based game server
  console, file manager, schedules, backups and a Minecraft plugin marketplace.
  Open the app and follow the setup wizard to create your administrator account.
  The database, cache, queue worker and scheduler are configured automatically.


  This app provides the management panel. To run game servers, connect a
  separately installed Wings or Elytra node from the administration area.
  It does not include a game server engine or provision a node on your Umbrel.


  Umbrel login protects the setup wizard and browser interface. Accounts,
  settings, encryption keys and uploaded panel assets persist across restarts
  and updates. Email delivery requires configuring your own SMTP service.
