version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: livinduck-hydrodactyl_panel_1
      APP_PORT: 80
      # Nodes use bearer authentication and cannot supply an Umbrel cookie.
      # The setup wizard, browser UI and all other APIs retain Umbrel auth.
      PROXY_AUTH_WHITELIST: /api/remote/*

  database:
    image: mariadb:11.4.13@sha256:1292844148b311e4ed4300022a996d39083f415a963e970cf47cad1b3b18e3a6
    restart: on-failure
    environment:
      MARIADB_DATABASE: panel
      MARIADB_USER: hydrodactyl
      MARIADB_PASSWORD: ${APP_LIVINDUCK_HYDRODACTYL_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${APP_LIVINDUCK_HYDRODACTYL_DB_ROOT_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/database:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  cache:
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: on-failure
    environment:
      REDIS_PASSWORD: ${APP_LIVINDUCK_HYDRODACTYL_REDIS_PASSWORD}
      REDISCLI_AUTH: ${APP_LIVINDUCK_HYDRODACTYL_REDIS_PASSWORD}
    command: [sh, -c, 'exec docker-entrypoint.sh redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - ${APP_DATA_DIR}/data/cache:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 30

  panel:
    image: ghcr.io/blueprintframework/hydrodactyl:v6.4.1@sha256:447fad9a4c9ea39e2faa6bcba985274346ea06e6eb1dbcd664d7c3dd1f1903f7
    restart: on-failure
    stop_grace_period: 1m
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://${APP_DOMAIN}:39404
      APP_TIMEZONE: UTC
      APP_ENVIRONMENT_ONLY: "false"
      APP_SERVICE_AUTHOR: noreply@example.com
      # The upstream entrypoint persists APP_KEY and HASHIDS_SALT in /app/var/.env.
      HASHIDS_LENGTH: "8"
      TRUSTED_PROXIES: ${NETWORK_IP}/16
      DB_CONNECTION: mariadb
      DB_HOST: database
      DB_PORT: "3306"
      DB_DATABASE: panel
      DB_USERNAME: hydrodactyl
      DB_PASSWORD: ${APP_LIVINDUCK_HYDRODACTYL_DB_PASSWORD}
      CACHE_STORE: redis
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: cache
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${APP_LIVINDUCK_HYDRODACTYL_REDIS_PASSWORD}
      CAPTCHA_PROVIDER: none
      # Email delivery is optional; configure SMTP in Administration > Settings.
      MAIL_MAILER: smtp
      MAIL_HOST: 127.0.0.1
      MAIL_PORT: "25"
      MAIL_FROM_ADDRESS: noreply@example.com
      LOG_LEVEL: warning
    volumes:
      - ${APP_DATA_DIR}/data/var:/app/var
      - ${APP_DATA_DIR}/data/logs:/app/storage/logs
      - ${APP_DATA_DIR}/data/uploads:/app/storage/app/public
    healthcheck:
      test: [CMD, curl, --fail, --silent, --output, /dev/null, http://127.0.0.1/auth/login]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
